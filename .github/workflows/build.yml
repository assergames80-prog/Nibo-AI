name: Build Nibo AI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty to just build.'
        required: false
        default: ''
      release_notes:
        description: 'Text for the release. Leave empty to use the automatically generated notes.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests on Windows (includes the real Windows voice helper)
        run: npm test
      - name: Build installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The installer is what one-click updates run (`--updated /S --force-run`): prove that
      # it really installs quietly, updates over itself, restarts Nibo and uninstalls.
      - name: Silent install, update over it, and uninstall (real installer)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = (Get-ChildItem dist -Filter 'Nibo-AI-Setup-*.exe' | Select-Object -First 1).FullName
          $dir = 'C:\nibo-ci-install'
          $exe = Join-Path $dir 'Nibo AI.exe'
          Write-Host "Installer: $setup"

          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "silent install stopped with code $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exe)) { throw "the silent install did not create $exe" }
          if (Get-Process -Name 'Nibo AI' -ErrorAction SilentlyContinue) { throw 'a plain silent install must not start Nibo' }
          Write-Host 'Silent install: ok'

          $p = Start-Process -FilePath $setup -ArgumentList '--updated', '/S', '--force-run', "/D=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "silent update stopped with code $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exe)) { throw 'the update removed Nibo' }
          Write-Host 'Update over the existing install: ok'

          $started = $false
          for ($i = 0; $i -lt 20 -and -not $started; $i++) {
            Start-Sleep -Seconds 1
            $started = [bool](Get-Process -Name 'Nibo AI' -ErrorAction SilentlyContinue)
          }
          if ($started) { Write-Host 'Nibo started again after the update: ok' }
          else { Write-Host '::warning::Nibo did not start after the silent update (--force-run)' }
          Get-Process -Name 'Nibo AI' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          $uninstaller = Join-Path $dir 'Uninstall Nibo AI.exe'
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "uninstall stopped with code $($p.ExitCode)" }
          if (Test-Path -LiteralPath $exe) { throw 'uninstall left Nibo AI.exe behind' }
          Write-Host 'Uninstall: ok'
      - uses: actions/upload-artifact@v4
        with:
          name: Nibo-AI-Windows
          path: dist/*.exe
          if-no-files-found: error
      # Runs for pushed v* tags, or for a manual run given a release_tag
      # (the release action then creates the tag on this commit).
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Nibo AI ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
